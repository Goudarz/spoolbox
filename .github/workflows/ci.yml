name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licences, bans, sources
        run: cargo deny check

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: v1 contract is up to date with its builder
        run: |
          python3 -I tools/api/openapi_v1.py /tmp/openapi-v1.json
          diff -u api/openapi-v1.json /tmp/openapi-v1.json
      - name: Lint
        run: npx --yes @redocly/cli@2.62.1 lint api/openapi-v1.json api/openapi-v2.json

  contract:
    name: API v1 snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        run: cargo build -p spoolbox --locked
      - name: Compare API responses with fixtures/api-v1
        run: |
          ./target/debug/spoolbox --listen 127.0.0.1:28125 --smtp 127.0.0.1:21125 --log-level warn &
          ./target/debug/spoolbox readyz --listen 127.0.0.1:28125 --wait --timeout 30s
          python3 -I tools/snapshot/api_v1.py --api http://127.0.0.1:28125 --smtp 127.0.0.1:21125

  web:
    name: web UI (build, type check, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install toolchain from rust-toolchain.toml
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the server with the UI embedded
        working-directory: .
        run: cargo build -p spoolbox --locked
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

  examples:
    name: examples
    runs-on: ubuntu-latest
    env:
      SPOOLBOX_URL: http://127.0.0.1:8025/
      SPOOLBOX_SMTP: 127.0.0.1:1025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build and start the server
        run: |
          cargo build -p spoolbox --locked
          ./target/debug/spoolbox --log-level warn &
          ./target/debug/spoolbox readyz --wait --timeout 30s
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Python
        run: python3 -I examples/python/test_signup.py
      - name: Node.js
        run: node --test examples/node/signup.test.mjs
      - name: Go
        working-directory: examples/go
        run: go test ./...
      - name: Shell
        run: SPOOLBOX=./target/debug/spoolbox sh examples/shell/signup.sh
