# cargo-deny 0.20 policy (ADR-012, ADR-015). Run: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisories; replaces a separate cargo-audit step.
ignore = []

[licenses]
# Permissive licences only; the shipped binary must stay compatible with MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
